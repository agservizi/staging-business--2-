name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          ini-values: memory_limit=512M

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (PHP_CodeSniffer)
        run: composer lint

      - name: Static Analysis (PHPStan)
        run: composer stan

      - name: Tests + Coverage (PHPUnit)
        run: |
          XDEBUG_MODE=coverage vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-text --coverage-clover coverage.xml

      - name: Coverage gate (optional)
        if: env.MIN_COVERAGE != ''
        run: |
          php -r "\$xml=simplexml_load_file('coverage.xml'); \$m=\$xml->project->metrics; \$cov=((float)\$m['statements']>0)?((float)\$m['coveredstatements']/(float)\$m['statements']*100):0; echo 'Coverage: '.number_format(\$cov,2)."%\n"; if (\$cov < (float)getenv('MIN_COVERAGE')) { fwrite(STDERR, 'Coverage below threshold: '.getenv('MIN_COVERAGE')."%\n"); exit(1);}"
        env:
          MIN_COVERAGE: ${{ vars.MIN_COVERAGE }}

  node:
    if: hashFiles('package-lock.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (npm)
        run: npm run lint --if-present

      - name: Build JS
        run: npm run build:js --if-present

      - name: Tests (npm)
        run: npm run test --if-present
