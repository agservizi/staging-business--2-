name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - production

jobs:
  deploy-corehost:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production branch to Gitea mirror
        env:
          GITEA_TOKEN: ${{ secrets.COREHOST_API_TOKEN }}
          GITEA_OWNER: Carmine
          GITEA_REPO: coresuite-business
        run: |
          git fetch origin production
          git push "https://oauth2:${GITEA_TOKEN}@git.coresuite.it/${GITEA_OWNER}/${GITEA_REPO}.git" \
            FETCH_HEAD:refs/heads/production

      - name: Trigger CoreHost deploy
        env:
          COREHOST_API_TOKEN: ${{ secrets.COREHOST_API_TOKEN }}
          COREHOST_APP_ID: ${{ secrets.COREHOST_APP_ID }}
        run: |
          curl -fsS -X POST \
            "https://panel.coresuite.it/api/v1/node-apps/${COREHOST_APP_ID}/deploy" \
            -H "Authorization: Bearer ${COREHOST_API_TOKEN}" \
            -H "Accept: application/json"

  deploy-hostinger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target directory based on branch
        id: vars
        run: |
          if [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "target=/home/u427445037/domains/coresuite.it/public_html/staging-business/" >> $GITHUB_OUTPUT
          else
            echo "target=/home/u427445037/domains/coresuite.it/public_html/business/" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH for Hostinger (port 65002)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '65002' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy files via rsync over SSH
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='uploads' \
            --exclude='backups' \
            --exclude='storage' \
            --exclude='.phpunit.result.cache' \
            --exclude='deploy/hostinger_deploy_ed25519' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '65002' }} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.vars.outputs.target }}

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
