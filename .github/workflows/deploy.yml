name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - production

jobs:
  deploy-corehost:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "CoreHost deploy disattivato — ripristino Hostinger"

  deploy-hostinger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target directory based on branch
        id: vars
        run: |
          if [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "remote=/domains/coresuite.it/public_html/staging-business/" >> $GITHUB_OUTPUT
          else
            echo "remote=/domains/coresuite.it/public_html/business/" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SFTP (Hostinger port 65002)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          ssh_private_key: ${{ secrets.SSH_KEY }}
          local_path: ./*
          remote_path: ${{ steps.vars.outputs.remote }}
          sftp_only: true
          delete_remote_files: false
